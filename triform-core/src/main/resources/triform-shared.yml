# ==========================================================================
# 底座共享配置入口(位于 triform-core, classpath 根)
#
# 用法:各服务 application.yml 中
#     spring:
#       config:
#         import: classpath:triform-shared.yml
#
# 本文件只做两件事(不含具体配置值):
#   1. 读取导入顺序:triform-defaults.yml(本地默认值) → Nacos(集中覆盖, 后导入者优先)
#   2. 声明 Nacos 客户端参数(server-addr/group/file-extension)
#
# 优先级:服务自身 yml 与 application-{profile}.yml 高于本文件引入的一切;
#        Nacos 高于本地默认值(改 Nacos 无需重新打包);Nacos 不可达时 optional 前缀使其跳过。
# ==========================================================================

spring:
  cloud:
    nacos:
      config:
        # Nacos 服务地址(与 Dubbo 注册中心同一实例)
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: ${TRIFORM_NACOS_GROUP:TRIFORM}
        file-extension: yml
        # 必须显式指定编码:Windows 下客户端默认用平台编码(GBK)解码配置,
        # 而配置含中文注释(UTF-8)会抛 MalformedInputException 并使配置整体失效(实测踩到)
        encode: UTF-8
  config:
    import:
      # 顺序即优先级:最后一个优先级最高
      - classpath:triform-defaults.yml
      - optional:nacos:triform-shared.yml?group=${TRIFORM_NACOS_GROUP:TRIFORM}&refreshEnabled=true
